<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtro de Resplandor Neón Cian -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g stroke="#00e5ff" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Círculo exterior y corona de laureles simulada -->
    <circle cx="250" cy="250" r="220" stroke-width="3" stroke-dasharray="8 4" opacity="0.6"/>
    <circle cx="250" cy="250" r="205" stroke-width="2"/>
    <circle cx="250" cy="250" r="195" stroke-width="1" opacity="0.4"/>

    <!-- Corona real superior -->
    <path d="M 180 110 L 195 70 L 222 95 L 250 50 L 278 95 L 305 70 L 320 110 Z" stroke-width="2.5" fill="rgba(0, 229, 255, 0.05)"/>
    <circle cx="250" cy="40" r="5" fill="#00e5ff"/>
    <path d="M 180 115 L 320 115" stroke-width="3"/>

    <!-- Banderas laterales -->
    <path d="M 160 180 L 110 130 M 110 130 L 110 260 M 110 130 L 155 160 M 110 195 L 158 220" stroke-width="2"/>
    <path d="M 340 180 L 390 130 M 390 130 L 390 260 M 390 130 L 345 160 M 390 195 L 342 220" stroke-width="2"/>

    <!-- Escudo Central Cuartelado -->
    <path d="M 170 145 H 330 V 270 C 330 350 250 390 250 390 C 250 390 170 350 170 270 Z" stroke-width="3.5" fill="rgba(6, 9, 17, 0.85)"/>
    
    <!-- Divisiones del Escudo -->
    <line x1="250" y1="145" x2="250" y2="388" stroke-width="2"/>
    <line x1="170" y1="250" x2="330" y2="250" stroke-width="2"/>

    <!-- Símbolos del Escudo (Estilo Wireframe Cyber) -->
    <!-- Cuartel 1: Corona/Torre -->
    <path d="M 195 210 L 205 180 L 215 195 L 225 180 L 235 210 Z" stroke-width="1.5"/>
    <!-- Cuartel 2: León 1 -->
    <path d="M 285 185 C 295 175 310 185 305 200 C 300 210 310 220 290 225" stroke-width="1.5"/>
    <!-- Cuartel 3: Columnas -->
    <path d="M 195 280 V 320 M 210 280 V 320 M 225 280 V 320 M 190 320 H 230" stroke-width="1.5"/>
    <!-- Cuartel 4: León 2 -->
    <path d="M 285 275 C 295 265 310 275 305 290 C 300 300 310 310 290 315" stroke-width="1.5"/>

    <!-- Escusón Central (Cruz Soberana) -->
    <circle cx="250" cy="250" r="22" stroke-width="2" fill="#060911"/>
    <path d="M 250 234 V 266 M 234 250 H 266" stroke-width="3"/>

    <!-- Guirnalda/Laureles Inferiores -->
    <path d="M 120 310 C 140 390 200 430 250 435 C 300 430 360 390 380 310" stroke-width="2" stroke-dasharray="6 6"/>
  </g>
</svg>
